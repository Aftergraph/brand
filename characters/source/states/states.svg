        <circle cx="-42" cy="27" r="6" fill="#4C8BD8"/><circle cx="-14" cy="-8" r="6" fill="#4C8BD8"/><circle cx="10" cy="10" r="6" fill="#4C8BD8"/><circle cx="41" cy="-27" r="6" fill="#4C8BD8"/>
