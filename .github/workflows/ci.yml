name: CI & Brand Token Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  RIVE_VERSION: "1.0.3"
  RIVE_INSTALLER_SHA256: "36ba445ffe27f5f814c59bb1c76e371bf47f9ed2448a681c4199783245c0e5b5"

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install deterministic dev tooling
        run: npm ci

      - name: Audit high severity dependencies
        run: npm run audit:high

      - name: Regenerate canonical families
        run: npm run generate

      - name: Reject generated drift
        run: git diff --exit-code

      - name: Run Brand OS semantic validator and tests
        run: npm run validate && npm test

      - name: Verify character candidate release readiness
        run: npm run character:candidate:verify

      - name: Validate JSON schemas
        run: |
          node -e "JSON.parse(require('fs').readFileSync('tokens.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"

      - name: Verify SVG assets integrity
        run: |
          node -e "
            const fs = require('fs');
            // ponytail: asset list comes from manifest.json (canonical layout),
            // never a hardcoded parallel list that rots.
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            const collect = (o) => Object.values(o || {}).flatMap(v => typeof v === 'string' ? [v] : collect(v));
            const files = [...new Set(collect(manifest.assets))];
            if (!files.length) throw new Error('No assets declared in manifest.json');
            files.forEach(f => {
              if (!fs.existsSync(f)) throw new Error('Missing: ' + f);
              const content = fs.readFileSync(f, 'utf8');
              if (!content.includes('<svg') || !content.includes('</svg>')) throw new Error('Invalid SVG: ' + f);
            });
            console.log('SVG assets verified: ' + files.length + ' files.');
          "

      - name: Verify Token Export Integrity
        run: |
          node -e "
            const fs = require('fs');
            const tokens = JSON.parse(fs.readFileSync('tokens.json', 'utf8'));
            // ponytail: canonical shape is flat snake_case (tokens.json v1.0.0),
            // not the old nested kebab layout.
            const colors = tokens.colors || {};
            for (const k of ['institution_black', 'control_cyan']) {
              if (!colors[k]) throw new Error('Missing ' + k);
            }
            for (const [k, v] of Object.entries(colors)) {
              if (typeof v !== 'string' || !/^#[0-9A-Fa-f]{6}$/.test(v)) throw new Error('Invalid color ' + k + ': ' + v);
            }
            console.log('Brand tokens valid.');
          "

  rive-runtime:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install deterministic dev tooling
        run: npm ci

      - name: Install Rive runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgles2 libx11-6 libwayland-egl1 libxkbcommon0

      - name: Install pinned Rive CLI
        run: |
          curl -fsSL https://releases.rive.app/cli/install.sh -o /tmp/rive-install.sh
          echo "$RIVE_INSTALLER_SHA256  /tmp/rive-install.sh" | sha256sum --check -
          bash /tmp/rive-install.sh
          export PATH="$HOME/.rive/bin:$PATH"
          echo "$HOME/.rive/bin" >> "$GITHUB_PATH"
          rive --version
          test "$(rive --version | awk '{print $2}')" = "$RIVE_VERSION"

      - name: Regenerate canonical character sources
        run: npm run generate

      - name: Verify Rive source and runtime behavior
        run: npm run character:rive:verify && npm run character:rive:qa

      - name: Reject generated and runtime drift
        run: git diff --exit-code
