name: Character Production Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RIVE_VERSION: "1.0.3"
  RIVE_INSTALLER_SHA256: "36ba445ffe27f5f814c59bb1c76e371bf47f9ed2448a681c4199783245c0e5b5"

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci
      - run: npm run audit:high
      - run: npm run check
      - run: npm run character:qa
      - run: npm run character:production:verify
      - run: git diff --exit-code

  rive-runtime:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgles2 libx11-6 libwayland-egl1 libxkbcommon0
      - name: Install pinned Rive CLI
        run: |
          curl -fsSL https://releases.rive.app/cli/install.sh -o /tmp/rive-install.sh
          echo "$RIVE_INSTALLER_SHA256  /tmp/rive-install.sh" | sha256sum --check -
          bash /tmp/rive-install.sh
          echo "$HOME/.rive/bin" >> "$GITHUB_PATH"
          "$HOME/.rive/bin/rive" --version
          test "$("$HOME/.rive/bin/rive" --version | awk '{print $2}')" = "$RIVE_VERSION"
      - run: npm run generate
      - run: npm run character:rive:verify && npm run character:rive:qa
      - run: git diff --exit-code

  package:
    needs: [core, rive-runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci
      - run: npm run character:production:verify
      - name: Export governed delivery assets
        run: npm run character:export
      - name: Build npm package
        run: npm pack
      - name: Upload verified package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aftergraph-brand-character-production-candidate
          path: |
            aftergraph-brand-*.tgz
            exports/characters/
          if-no-files-found: error
