name: Character External Review Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm run character:candidate:verify
      - run: npm run character:review:bundle
      - name: Upload exact-HEAD review handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aftergraph-character-review-${{ github.sha }}
          path: dist/character-review-bundle
          if-no-files-found: error
          retention-days: 14
